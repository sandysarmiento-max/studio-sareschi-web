name: Apply flipbook links to PR 130

on:
  push:
    branches:
      - feat/paid-products-flipbook-links
    paths:
      - .github/workflows/apply-flipbook-links.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paid-products-flipbook-links
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply scoped flipbook changes
        run: python .github/scripts/run_flipbook_patch.py

      - name: Run regression checks
        run: |
          node --test tests/*.test.js
          node --test tests/paid-products-flipbook.test.js
          node --check lib/paid-products-admin-handler.js
          node --check api/pdf-access.js
          node --check api/plantilla.js
          git diff --check

      - name: Commit changes to PR branch
        run: |
          git config user.name "studio-sareschi-bot"
          git config user.email "studio-sareschi-bot@users.noreply.github.com"
          git add lib/paid-products-admin-handler.js public/admin/paid-products/index.html api/pdf-access.js public/pdfs/index.html api/plantilla.js tests/paid-products-flipbook.test.js
          git rm .github/workflows/apply-flipbook-links.yml .github/scripts/apply_flipbook_links.py .github/scripts/run_flipbook_patch.py
          git commit -m "Completa enlaces de flipbook en productos de paga"
          git push origin HEAD:feat/paid-products-flipbook-links
