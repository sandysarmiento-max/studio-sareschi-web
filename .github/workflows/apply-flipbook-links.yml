              "          if (payload.purchaseMigrationPending) {\n            setStatus('Los productos se muestran con los precios anteriores como referencia. Ejecuta la migración de compra directa antes de guardar cambios.', true);\n          } else if (payload.flipbookMigrationPending) {\n            setStatus('La lista cargó correctamente, pero falta ejecutar la migración del campo “Enlace para hojear / Flipbook” en Supabase. No guardes productos hasta aplicarla.', true);\n          }\n",
