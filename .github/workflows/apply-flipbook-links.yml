              'admin legacy normalize',
          )
          new_list = r'''async function listProducts(res) {
  try {
    const products = await callSupabase(
      `/rest/v1/paid_products?select=${encodeURIComponent(PRODUCT_COLUMNS)}&order=sort_order.asc,created_at.asc`
    );
    return json(res, 200, {
      products,
      purchaseMigrationPending: false,
      flipbookMigrationPending: false,
    });
  } catch (error) {
    if (isMissingFlipbookColumn(error)) {
      try {
        const products = await callSupabase(
          `/rest/v1/paid_products?select=${encodeURIComponent(PRODUCT_COLUMNS_WITHOUT_FLIPBOOK)}&order=sort_order.asc,created_at.asc`
        );
        return json(res, 200, {
          products: Array.isArray(products)
            ? products.map((product) => ({ ...product, flipbook_url: '' }))
            : products,
          purchaseMigrationPending: false,
          flipbookMigrationPending: true,
        });
      } catch (fallbackError) {
        if (!isMissingPurchaseColumns(fallbackError)) throw fallbackError;
        const products = await callSupabase(
          `/rest/v1/paid_products?select=${encodeURIComponent(LEGACY_PRODUCT_COLUMNS)}&order=sort_order.asc,created_at.asc`
        );
        return json(res, 200, {
          products: Array.isArray(products) ? products.map(normalizeLegacyProduct) : products,
          purchaseMigrationPending: true,
          flipbookMigrationPending: true,
        });
      }
    }

    if (isMissingPurchaseColumns(error)) {
      const products = await callSupabase(
        `/rest/v1/paid_products?select=${encodeURIComponent(LEGACY_PRODUCT_COLUMNS)}&order=sort_order.asc,created_at.asc`
      );
      return json(res, 200, {
        products: Array.isArray(products) ? products.map(normalizeLegacyProduct) : products,
        purchaseMigrationPending: true,
        flipbookMigrationPending: false,
      });
    }
    if (String(error.message || '').includes("Could not find the table 'public.paid_products'")) {
      return json(res, 503, {
        code: 'missing_paid_products_table',
        error: 'La tabla paid_products todavía no existe en este proyecto de Supabase.',
      });
    }
    throw error;
  }
}

'''
