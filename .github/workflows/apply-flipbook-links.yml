name: Apply flipbook links to PR 130

on:
  push:
    branches:
      - feat/paid-products-flipbook-links
    paths:
      - .github/workflows/apply-flipbook-links.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/paid-products-flipbook-links
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply scoped flipbook changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def text(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          def replace_once(value, old, new, label):
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, found {count}')
              return value.replace(old, new, 1)

          def sub_once(value, pattern, replacement, label):
              next_value, count = re.subn(pattern, replacement, value, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 regex match, found {count}')
              return next_value

          # 1) Admin backend
          path = 'lib/paid-products-admin-handler.js'
          s = text(path)
          s = replace_once(
              s,
              "const PRODUCT_COLUMNS =\n  'id,code,title,description,price_yape_pe,price_paypal_usd,hotmart_url,main_image_url,preview_01_url,preview_02_url,preview_03_url,active,sort_order,created_at,updated_at';\n",
              "const PRODUCT_COLUMNS =\n  'id,code,title,description,price_yape_pe,price_paypal_usd,hotmart_url,flipbook_url,main_image_url,preview_01_url,preview_02_url,preview_03_url,active,sort_order,created_at,updated_at';\nconst PRODUCT_COLUMNS_WITHOUT_FLIPBOOK =\n  'id,code,title,description,price_yape_pe,price_paypal_usd,hotmart_url,main_image_url,preview_01_url,preview_02_url,preview_03_url,active,sort_order,created_at,updated_at';\n",
              'admin columns',
          )
          purchase_fn = """function isMissingPurchaseColumns(error) {
  const message = String(error?.message || '').toLowerCase();
  const mentionsNewColumn =
    message.includes('hotmart_url') ||
    message.includes('price_yape_pe') ||
    message.includes('price_paypal_usd');

  return mentionsNewColumn &&
    (message.includes('does not exist') || message.includes('schema cache') || message.includes('column'));
}
"""
          flipbook_helpers = purchase_fn + """
function isMissingFlipbookColumn(error) {
  const message = String(error?.message || '').toLowerCase();
  return message.includes('flipbook_url') &&
    (message.includes('does not exist') || message.includes('schema cache') || message.includes('column'));
}

function sanitizeFlipbookUrl(value) {
  const raw = String(value || '').trim();
  if (!raw) return '';

  const invalidMessage =
    'El enlace para hojear debe ser /hojear/?agenda=<slug> o una URL HTTPS válida.';

  if (raw.startsWith('//')) {
    throw new Error(invalidMessage);
  }

  const relativeMatch = raw.match(/^\/hojear\/\?agenda=([a-z0-9]+(?:-[a-z0-9]+)*)$/);
  if (relativeMatch) {
    const slug = relativeMatch[1];
    if (slug.length >= 2 && slug.length <= 100) return raw;
    throw new Error(invalidMessage);
  }

  if (raw.startsWith('/')) {
    throw new Error(invalidMessage);
  }

  try {
    const url = new URL(raw);
    if (url.protocol !== 'https:') throw new Error(invalidMessage);
    return url.toString();
  } catch (error) {
    if (error?.message === invalidMessage) throw error;
    throw new Error(invalidMessage);
  }
}
"""
