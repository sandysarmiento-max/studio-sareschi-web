<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Prueba real de tapas HARD · Studio Sareschi</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f0e9}
    .lab-note{position:fixed;z-index:9999;top:8px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:#315c62;color:#fff;font:12px/1.2 system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.12);pointer-events:none}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <div class="lab-note">PRUEBA REAL · 1–2 y dos últimas HARD · usa páginas reales · producción intacta</div>
  <iframe id="adminFrame" src="./index.html" title="Gestor experimental de muestras"></iframe>
  <script>
    (() => {
      const adminFrame = document.getElementById('adminFrame');

      adminFrame.addEventListener('load', () => {
        const win = adminFrame.contentWindow;
        const doc = adminFrame.contentDocument;
        if (!win || !doc) return;

        const installHardCoverInterceptor = () => {
          const previewFrame = doc.getElementById('previewFrame');
          if (!previewFrame || previewFrame.dataset.hardInterceptor === '1') return;

          const descriptor = Object.getOwnPropertyDescriptor(win.HTMLIFrameElement.prototype, 'srcdoc');
          if (!descriptor || !descriptor.get || !descriptor.set) return;

          Object.defineProperty(previewFrame, 'srcdoc', {
            configurable: true,
            get() {
              return descriptor.get.call(this);
            },
            set(value) {
              let nextValue = String(value || '');
              const marker = 'window.__AGENDA_PREVIEW_CONFIG__={';
              if (nextValue.includes(marker) && !nextValue.includes('"hardCovers":true')) {
                nextValue = nextValue.replace(marker, `${marker}"hardCovers":true,`);
              }
              descriptor.set.call(this, nextValue);
            }
          });

          previewFrame.dataset.hardInterceptor = '1';
        };

        installHardCoverInterceptor();
        win.addEventListener('agenda-manager-ready', installHardCoverInterceptor);
      });
    })();
  </script>
</body>
</html>
