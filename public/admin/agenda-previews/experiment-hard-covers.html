<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Prueba de tapas HARD · Studio Sareschi</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f0e9}
    .lab-note{position:fixed;z-index:9999;top:8px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:999px;background:#315c62;color:#fff;font:12px/1.2 system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.12);pointer-events:none}
    iframe{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <div class="lab-note">PRUEBA · tapas HARD · producción intacta</div>
  <iframe id="adminFrame" src="./index.html" title="Gestor experimental de muestras"></iframe>
  <script>
    (() => {
      const adminFrame = document.getElementById('adminFrame');

      adminFrame.addEventListener('load', () => {
        const doc = adminFrame.contentDocument;
        if (!doc) return;
        const previewFrame = doc.getElementById('previewFrame');
        if (!previewFrame) return;

        const enableHardCovers = () => {
          const srcdoc = previewFrame.getAttribute('srcdoc') || '';
          if (!srcdoc || srcdoc.includes('"hardCovers":true')) return;
          const marker = 'window.__AGENDA_PREVIEW_CONFIG__={';
          if (!srcdoc.includes(marker)) return;
          previewFrame.setAttribute('srcdoc', srcdoc.replace(marker, `${marker}"hardCovers":true,`));
        };

        new MutationObserver(enableHardCovers).observe(previewFrame, {
          attributes: true,
          attributeFilter: ['srcdoc']
        });
        enableHardCovers();
      });
    })();
  </script>
</body>
</html>
