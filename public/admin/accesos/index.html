<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Admin · Gestión de accesos | Studio Sareschi</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .invite-card {
        max-width: 560px;
        margin: 0 auto;
        display: grid;
        gap: 12px;
      }
      .invite-form {
        display: grid;
        gap: 10px;
      }
      .invite-form label {
        display: grid;
        gap: 6px;
        font-size: 14px;
        color: #6f6471;
      }
      .invite-form input:not([type=checkbox]) {width:100%;box-sizing:border-box;border:1px solid #e4ccd9;border-radius:10px;padding:11px;font:inherit;background:white}
      .app-options{border:1px solid #ead7e2;border-radius:12px;padding:12px;display:grid;gap:8px;margin:4px 0}
      .app-options legend{padding:0 6px;font-weight:600;color:#453440}
      .invite-form .app-choice{display:flex;align-items:center;gap:9px;padding:8px;border-radius:8px;background:#fcf6f9;color:#453440}
      .app-choice input{accent-color:#b63873;width:17px;height:17px;margin:0}
      .action-buttons{display:grid;gap:8px}
      .action-buttons button{width:100%}
      .revoke-btn{color:#943653!important}
      #status{white-space:pre-line}
      .status-ok {
        color: #2f6f44;
      }
      .status-error {
        color: #8f1d4f;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="/">Studio Sareschi</a>
      </div>
    </header>

    <main class="section section-soft">
      <div class="container">
        <article class="card invite-card">
          <div class="section-heading" style="margin: 0">
            <p class="eyebrow">Panel interno</p>
            <h1 style="margin-bottom: 8px">Gestión de accesos</h1>
            <p class="hero-copy" style="margin: 0">Activa o retira una o varias aplicaciones. Las renovaciones son manuales.</p>
          </div>

          <form id="invite-form" class="invite-form">
            <label>
              Token admin (INVITE_ADMIN_TOKEN)
              <input id="token" type="password" autocomplete="off" required />
            </label>

            <label>
              Email
              <input id="email" type="email" autocomplete="email" required placeholder="clienta@correo.com" />
            </label>

            <fieldset class="app-options">
              <legend>Aplicaciones</legend>
              <label class="app-choice"><input type="checkbox" name="apps" value="folia_studio"> Folia Studio</label>
              <label class="app-choice"><input type="checkbox" name="apps" value="aral_calc"> Aral Calc</label>
              <label class="app-choice"><input type="checkbox" name="apps" value="aral_costos"> Aral Costos</label>
              <label class="app-choice"><input type="checkbox" name="apps" value="stackpdf"> StackPDF</label>
              <p class="tiny-note" style="margin:0">Marca solo las aplicaciones que deseas activar o retirar. Consultar no requiere selección.</p>
            </fieldset>
            <div class="action-buttons">
              <button class="btn btn-primary" type="submit" data-action="activate">Activar / invitar</button>
              <button class="btn btn-secondary" type="submit" data-action="inspect">Consultar permisos actuales</button>
              <button class="btn btn-secondary revoke-btn" type="submit" data-action="revoke">Retirar accesos seleccionados</button>
            </div>
          </form>

          <p id="status" class="tiny-note" aria-live="polite">Listo para consultar o gestionar accesos.</p>
        </article>
      </div>
    </main>

    <script>
      const STORAGE_KEY = 'unified_invite_admin_token';
      const form = document.getElementById('invite-form');
      const emailInput = document.getElementById('email');
      const tokenInput = document.getElementById('token');
      const statusEl = document.getElementById('status');
      const buttons = [...form.querySelectorAll('button[data-action]')];
      const choices = [...form.querySelectorAll('input[name="apps"]')];
      const names = {folia_studio:'Folia Studio',aral_calc:'Aral Calc',aral_costos:'Aral Costos',stackpdf:'StackPDF'};
      tokenInput.value = sessionStorage.getItem(STORAGE_KEY) || '';

      function setStatus(message, state = 'idle') {
        statusEl.textContent = message;
        statusEl.classList.remove('status-ok', 'status-error');

        if (state === 'ok') {
          statusEl.classList.add('status-ok');
          return;
        }

        if (state === 'error') {
          statusEl.classList.add('status-error');
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const email = String(emailInput.value || '').trim();
        const token = String(tokenInput.value || '').trim();

        if (!email) {
          setStatus('Ingresa un email válido.', 'error');
          return;
        }

        if (!token) {
          setStatus('Pega el token INVITE_ADMIN_TOKEN.', 'error');
          return;
        }

        sessionStorage.setItem(STORAGE_KEY, token);

        const action = event.submitter?.dataset.action || 'inspect';
        const apps = choices.filter(x=>x.checked).map(x=>x.value);
        if(action !== 'inspect' && !apps.length){setStatus('Selecciona al menos una aplicación.','error');return;}
        if(action === 'revoke' && !confirm('¿Retirar únicamente '+apps.map(x=>names[x]).join(', ')+' para '+email+'?')) return;
        if(action === 'activate' && !confirm('¿Activar '+apps.map(x=>names[x]).join(', ')+' para '+email+'?')) return;
        buttons.forEach(b=>b.disabled=true);
        setStatus('Procesando...', 'idle');

        try {
          const response = await fetch('/api/app-invite', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ email, apps, action }),
          });

          const payload = await response.json().catch(() => ({}));

          if (!response.ok) {
            const reason = payload?.details || payload?.error || `Error ${response.status}`;
            setStatus(`No se pudo enviar: ${reason}`, 'error');
            return;
          }

          if(action === 'inspect'){
            const active = new Map((payload.access||[]).map(x=>[x.app_key,x.status]));
            setStatus(Object.entries(names).map(([key,label])=>label+': '+(active.get(key)==='active'?'Activo':'Sin acceso activo')).join('\n'),'ok');
          } else {
            setStatus(action==='revoke'?'Accesos retirados: '+payload.removed+'. Los demás se conservan.':(payload.invited?'Una invitación enviada. ':'Cuenta existente. ')+'Accesos activados: '+apps.map(x=>names[x]).join(', '),'ok');
            choices.forEach(x=>x.checked=false);
          }
        } catch (error) {
          setStatus(`Error de red: ${String(error?.message || error)}`, 'error');
        } finally {
          buttons.forEach(b=>b.disabled=false);
        }
      });
    </script>
  </body>
</html>
