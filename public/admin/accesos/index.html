<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · Gestión de accesos | Studio Sareschi</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .invite-card {
        max-width: 560px;
        margin: 0 auto;
        display: grid;
        gap: 12px;
      }
      .invite-form {
        display: grid;
        gap: 10px;
      }
      .invite-form label {
        display: grid;
        gap: 6px;
        font-size: 14px;
        color: #6f6471;
      }
      .status-ok {
        color: #2f6f44;
      }
      .status-error {
        color: #8f1d4f;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="/">Studio Sareschi</a>
      </div>
    </header>

    <main class="section section-soft">
      <div class="container">
        <article class="card invite-card">
          <div class="section-heading" style="margin: 0">
            <p class="eyebrow">Panel interno</p>
            <h1 style="margin-bottom: 8px">Gestión de accesos</h1>
            <p class="hero-copy" style="margin: 0">Activa o retira permisos individuales. Las renovaciones son manuales.</p>
          </div>

          <form id="invite-form" class="invite-form">
            <label>
              Token admin (INVITE_ADMIN_TOKEN)
              <input id="token" type="password" autocomplete="off" required />
            </label>

            <label>
              Email
              <input id="email" type="email" autocomplete="email" required placeholder="clienta@correo.com" />
            </label>

            <label>Aplicación<select id="app" required><option value="folia_studio">Folia Studio</option><option value="aral_calc">Aral Calc</option><option value="aral_costos">Aral Costos</option><option value="stackpdf">StackPDF</option></select></label><label>Acción<select id="action"><option value="inspect">Consultar permisos</option><option value="activate">Activar / invitar</option><option value="revoke">Retirar acceso</option></select></label><button class="btn btn-primary" type="submit" id="send-btn">Ejecutar</button>
          </form>

          <p id="status" class="tiny-note" aria-live="polite">Listo para enviar.</p>
        </article>
      </div>
    </main>

    <script>
      const STORAGE_KEY = 'unified_invite_admin_token';
      const form = document.getElementById('invite-form');
      const emailInput = document.getElementById('email');
      const tokenInput = document.getElementById('token');
      const statusEl = document.getElementById('status');
      const sendBtn = document.getElementById('send-btn');

      const appInput = document.getElementById('app');
      const actionInput = document.getElementById('action');
      const initialApp = new URLSearchParams(location.search).get('app');
      if ([...appInput.options].some(o => o.value === initialApp)) appInput.value = initialApp;
      tokenInput.value = sessionStorage.getItem(STORAGE_KEY) || '';

      function setStatus(message, state = 'idle') {
        statusEl.textContent = message;
        statusEl.classList.remove('status-ok', 'status-error');

        if (state === 'ok') {
          statusEl.classList.add('status-ok');
          return;
        }

        if (state === 'error') {
          statusEl.classList.add('status-error');
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const email = String(emailInput.value || '').trim();
        const token = String(tokenInput.value || '').trim();

        if (!email) {
          setStatus('Ingresa un email válido.', 'error');
          return;
        }

        if (!token) {
          setStatus('Pega el token INVITE_ADMIN_TOKEN.', 'error');
          return;
        }

        sessionStorage.setItem(STORAGE_KEY, token);

        const app = appInput.value, action = actionInput.value;
        if(action === 'revoke' && !confirm('¿Retirar únicamente el acceso a '+appInput.selectedOptions[0].text+' para '+email+'?')) return;
        sendBtn.disabled = true;
        setStatus('Enviando invitación...', 'idle');

        try {
          const response = await fetch('/api/app-invite', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ email, app, action }),
          });

          const payload = await response.json().catch(() => ({}));

          if (!response.ok) {
            const reason = payload?.details || payload?.error || `Error ${response.status}`;
            setStatus(`No se pudo enviar: ${reason}`, 'error');
            return;
          }

          setStatus(action === 'inspect' ? (payload.access || []).map(x=>x.app_key+': '+x.status).join(' · ') || 'Sin permisos activos registrados' : action === 'revoke' ? 'Acceso retirado (o ya inexistente).' : payload.invited ? 'Invitación enviada y acceso activado.' : 'Cuenta existente: acceso activado.', 'ok');
        } catch (error) {
          setStatus(`Error de red: ${String(error?.message || error)}`, 'error');
        } finally {
          sendBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
