<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · PDFs gratuitos | Studio Sareschi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/admin/freebies/admin.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="/">Studio Sareschi</a>
        <nav aria-label="Principal"><ul class="nav-links"><li><a href="/pdfs/">Plantillas</a></li><li><a href="/acceso/">Acceso</a></li></ul></nav>
      </div>
    </header>

    <main class="section section-soft">
      <div class="container freebies-admin-shell">
        <div class="section-heading freebies-heading">
          <p class="eyebrow">Panel privado</p>
          <h1>PDFs gratuitos</h1>
          <p class="hero-copy">Administra archivos, miniaturas y visibilidad de la Zona Gratuita.</p>
        </div>

        <article class="card auth-card" id="auth-card">
          <form id="login-form" class="stack">
            <label>Email <input id="email" type="email" required autocomplete="email" /></label>
            <label>Contraseña <input id="password" type="password" required autocomplete="current-password" /></label>
            <button class="btn btn-primary" id="login-btn" type="submit">Entrar al panel</button>
            <a href="/acceso/recuperar/" class="tiny-note">¿Olvidaste tu contraseña?</a>
          </form>
          <div id="session-box" class="hidden stack">
            <p class="session-label"><strong>Sesión administrativa activa</strong></p>
            <div class="actions">
              <button class="btn btn-secondary" id="refresh-btn" type="button">Actualizar lista</button>
              <button class="btn btn-secondary" id="logout-btn" type="button">Cerrar sesión</button>
            </div>
          </div>
          <p id="status" class="tiny-note status" aria-live="polite"></p>
        </article>

        <section id="panel" class="hidden stack">
          <div class="toolbar">
            <div><strong id="resource-count">0 recursos</strong><p>Activos e inactivos</p></div>
            <button id="new-resource-btn" type="button" class="btn btn-primary">+ Nuevo recurso</button>
          </div>
          <div id="resources-grid" class="resources-grid"></div>
        </section>
      </div>
    </main>

    <template id="resource-template">
      <article class="resource-card">
        <div class="resource-preview"><img alt="Miniatura del recurso" /><span>Sin miniatura nueva</span></div>
        <form class="resource-form stack">
          <div class="resource-card__head"><div><span class="state-pill"></span><small class="slug-label"></small></div></div>
          <div class="field-grid">
            <label>Título <input name="title" type="text" maxlength="200" required /></label>
            <label>Categoría <input name="category" type="text" maxlength="100" /></label>
            <label class="wide">Descripción <textarea name="description" rows="3" maxlength="2000"></textarea></label>
            <label>Orden <input name="sort_order" type="number" min="0" max="1000000" required /></label>
            <label class="toggle"><input name="is_active" type="checkbox" /> Visible en la web</label>
          </div>
          <div class="file-grid">
            <label>PDF <input name="pdf_file" type="file" accept="application/pdf,.pdf" /></label>
            <label>Miniatura <input name="thumbnail_file" type="file" accept="image/jpeg,image/png,image/webp" /></label>
          </div>
          <p class="asset-status"></p>
          <div class="actions">
            <button class="btn btn-primary save-btn" type="submit">Guardar cambios</button>
            <button class="btn btn-secondary upload-pdf-btn" type="button">Subir o reemplazar PDF</button>
            <button class="btn btn-secondary upload-thumbnail-btn" type="button">Subir o reemplazar miniatura</button>
            <button class="danger-btn delete-btn" type="button">Eliminar</button>
          </div>
        </form>
      </article>
    </template>

    <script src="/admin/freebies/admin.js"></script>
  </body>
</html>
